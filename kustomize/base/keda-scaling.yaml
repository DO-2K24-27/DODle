apiVersion: v1
kind: Secret
metadata:
  name: keda-rabbitmq-secret
  namespace: polytech
type: Opaque
stringData:
  host: "amqp://guest:password@dodle-rabbitmq.polytech.svc.cluster.local:5672/"
  vhostName: "/"
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: keda-trigger-auth-rabbitmq-conn
  namespace: polytech
spec:
  secretTargetRef:
    - parameter: host
      name: keda-rabbitmq-secret
      key: host
    - parameter: vhostName
      name: keda-rabbitmq-secret
      key: vhostName
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: dodle-frontend-rabbitmq-scaledobject
  namespace: polytech
spec:
  scaleTargetRef:
    name: dodle-frontend
    kind: Deployment
  minReplicaCount: 2
  maxReplicaCount: 6
  cooldownPeriod: 10
  pollingInterval: 5
  triggers:
    - type: rabbitmq
      metadata:
        protocol: amqp
        queueName: frontend-tasks
        mode: QueueLength
        value: "10"
      authenticationRef:
        name: keda-trigger-auth-rabbitmq-conn
  advanced:
    restoreToOriginalReplicaCount: true
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 10
