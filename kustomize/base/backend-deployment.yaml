apiVersion: apps/v1
kind: Deployment
metadata:
  name: dodle-backend
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: dodle-backend
  template:
    metadata:
      labels:
        app: dodle-backend
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - dodle-backend
              topologyKey: kubernetes.io/hostname
      containers:
        - name: backend
          image: proxyfil/dodle-api:1.0.1
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env:
            - name: NODE_ENV
              value: "production"
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: dodle-backend-secret
                  key: MONGO_URI
            - name: MONGODB_DATABASE
              value: "dodle"
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dodle-backend-secret
                  key: API_TOKEN
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
